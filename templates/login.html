<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/myfirstproject/static/CSS/login.css">
  <title>Login | Nexora IT Solution</title>
</head>

<body>

<div class="login-wrapper">
  <h1>Nexora IT Solution</h1>
  <p>Login to your account</p>

  <div class="login-box">
    <h2>Login</h2>

    <form method="POST">
      {% csrf_token %}

      <label>Email / Username</label>
      <input type="text" name="username">

      <label>Password</label>
      <input type="password" name="password">

      <div class="options">
        <label><input type="checkbox"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit">LOGIN</button>
    </form>

    {% if error %}
      <p style="color:red">{{ error }}</p>
    {% endif %}

  </div>
</div>

</body>
</html>
